<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <style>
        :root {
            --color-naranja-principal: #EA7900;
            --color-fondo-oscuro: #000000;
            --color-texto-principal: var(--color-naranja-principal);
            --color-error: #FF3333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--color-fondo-oscuro);
            color: var(--color-texto-principal);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 500px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(234, 121, 0, 0.2);
            border-top: 4px solid var(--color-naranja-principal);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            display: none;
            border: 1px solid var(--color-naranja-principal);
            padding: 20px;
            border-radius: 8px;
            background-color: rgba(234, 121, 0, 0.05);
        }

        .btn-retry {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            color: var(--color-fondo-oscuro);
            background-color: var(--color-naranja-principal);
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-retry:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="redirect-section">
            <div class="spinner"></div>
            <h1>Redireccionando...</h1>
            <p>Un momento por favor.</p>
        </div>

        <div id="error-section" class="error-box">
            <h1 style="color: var(--color-naranja-principal);">¡Error al redireccionar!</h1>
            <p id="error-message">No se pudo acceder a la página de destino o la URL no responde.</p>
            <button class="btn-retry" onclick="ejecutarRedireccion()">Reintentar</button>
        </div>
    </div>

    <script>
        const URL_DESTINO = "https://Bikotworl.com/Web"; 

        const redirectSection = document.getElementById('redirect-section');
        const errorSection = document.getElementById('error-section');
        const errorMessageEl = document.getElementById('error-message');

        function mostrarError(mensaje) {
            redirectSection.style.display = 'none';
            errorSection.style.display = 'block';
            if (mensaje) {
                errorMessageEl.textContent = mensaje;
            }
        }

        function ejecutarRedireccion() {
            errorSection.style.display = 'none';
            redirectSection.style.display = 'block';

            try {
                if (!URL_DESTINO || URL_DESTINO === "") {
                    throw new Error("La URL de destino no ha sido configurada correctamente.");
                }

                window.location.href = URL_DESTINO;

                setTimeout(() => {
                    mostrarError("La redirección tardó demasiado o fue bloqueada por el navegador.");
                }, 3000);

            } catch (error) {
                mostrarError(error.message);
            }
        }

        ejecutarRedireccion();
    </script>

</body>
</html>
